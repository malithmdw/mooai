version: "3.9"

# Enterprise AI Assistant — POC Docker Compose
#
# External services NOT in this file (provide keys in .env):
#   - Anthropic API
#   - OpenAI API (embeddings)
#   - Pinecone
#   - LangSmith (optional)
#
# Usage:
#   cp .env.example .env          # add your API keys
#   docker compose up --build

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mooai
      POSTGRES_USER: mooai
      POSTGRES_PASSWORD: mooai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # FastAPI backend
  # -------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mooai:mooai_dev_password@postgres:5432/mooai
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Streamlit UI
  # -------------------------------------------------------------------------

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
